<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ghiles</title>
<style>
  :root{
    --bg:#12111A;
    --bg2:#1B1927;
    --text:#F5F3FF;
    --muted:#9A94B8;
    --pink:#FF5C7A;
    --blue:#4C6FFF;
    --green:#00D68F;
    --tiktok:#25F4EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(-45deg,
      #FF5C7A, #4C6FFF, #00D68F, #FFB86B, #A855F7, #FF5C7A);
    background-size:400% 400%;
    animation:colorShift 8s ease infinite;
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 40px;
  }
  @keyframes colorShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .profile{
    text-align:center;
    margin-bottom:36px;
    opacity:0;
    animation:fadeIn .6s ease forwards;
  }
  .avatar{
    width:92px;height:92px;border-radius:50%;
    margin:0 auto 16px;
    padding:3px;
    background:linear-gradient(135deg,var(--pink),var(--blue),var(--green));
  }
  .avatar img{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--bg);
  }
  .profile h1{
    font-size:22px;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:-0.2px;
  }
  .profile p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }
  .links{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-card{
    opacity:0;
    transform:translateY(10px);
    animation:fadeIn .5s ease forwards;
    text-decoration:none;
    color:var(--text);
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .link-card:nth-child(1){animation-delay:.05s;}
  .link-card:nth-child(2){animation-delay:.15s;}
  .link-card:nth-child(3){animation-delay:.25s;}
  .link-card:nth-child(4){animation-delay:.35s;}

  .link-card:active{ transform:scale(0.97); }

  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.55);
    transform:scale(0);
    animation:ripple .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes ripple{
    to{ transform:scale(1); opacity:0; }
  }

  .icon{
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-size:20px;
  }
  .icon.insta{background:radial-gradient(circle at 30% 110%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);}
  .icon.fb{background:#1877F2;}
  .icon.giphy{background:#00D68F;}
  .icon.tiktok{background:#010101;}

  .link-text .name{
    font-weight:700;
    font-size:16px;
    margin-bottom:2px;
  }
  .link-text .handle{
    font-size:13px;
    color:var(--muted);
  }

  .link-card.insta:hover{border-color:var(--pink);}
  .link-card.fb:hover{border-color:var(--blue);}
  .link-card.giphy:hover{border-color:var(--green);}
  .link-card.tiktok:hover{border-color:var(--tiktok);}

  @keyframes fadeIn{
    to{opacity:1; transform:translateY(0);}
  }

  footer{
    margin-top:40px;
    color:var(--muted);
    font-size:12px;
  }

  @media (prefers-reduced-motion: reduce){
    .profile, .link-card{ animation:none; opacity:1; transform:none; }
    body{ animation:none; }
  }

  .music-btn{
    position:fixed;
    top:16px;
    left:16px;
    width:48px;height:48px;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    padding:0;
    z-index:10;
    transition:transform .15s ease;
  }
  .music-btn:active{ transform:scale(0.92); }
  .music-btn.playing{ animation:pulse 1.4s ease-in-out infinite; }
  .music-btn svg{ width:22px; height:22px; }
  .music-btn .bar{ transform-origin:bottom; animation:none; }
  .music-btn.playing .bar1{ animation:bar 0.9s ease-in-out infinite; }
  .music-btn.playing .bar2{ animation:bar 0.9s ease-in-out infinite .15s; }
  .music-btn.playing .bar3{ animation:bar 0.9s ease-in-out infinite .3s; }
  @keyframes bar{
    0%,100%{ transform:scaleY(0.4); }
    50%{ transform:scaleY(1); }
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,0.25); }
    50%{ box-shadow:0 0 0 8px rgba(255,255,255,0); }
  }
</style>
</head>

  <button class="music-btn" id="music-toggle" aria-label="تشغيل الموسيقى">🔇</button>

  <script>
    var audio = document.getElementById('bg-music');
    var btn = document.getElementById('music-toggle');
    var playing = false;

    btn.addEventListener('click', function(){
      if (playing){
        audio.pause();
        btn.textContent = '🔇';
        btn.classList.remove('playing');
      } else {
        audio.play().catch(function(){});
        btn.textContent = '🔊';
        btn.classList.add('playing');
      }
      playing = !playing;
    });
  </script>

  <script>
    document.querySelectorAll('.link-card').forEach(function(card){
      card.addEventListener('click', function(e){
        var href = card.getAttribute('href');
        var target = card.getAttribute('target');
        e.preventDefault();

        var rect = card.getBoundingClientRect();
        var ripple = document.createElement('span');
        var size = Math.max(rect.width, rect.height) * 2;
        var x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
        var y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;

        ripple.className = 'ripple';
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        card.appendChild(ripple);

        setTimeout(function(){
          window.open(href, target || '_self');
          ripple.remove();
        }, 260);
      });
    });
  </script>
